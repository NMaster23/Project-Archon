[package]
name = "ui"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["sync", "rt", "macros", "process", "io-util"] }
axum = {  version = "0.8.9", features = ["ws", "multipart"] }
rust-embed = "8.12.0"
mime_guess = "2.0.5"
serde = { workspace = true, features = ["derive"] }
talos-auth = { path = "../auth", package = "auth" }
talos-core = { path = "../core", package = "talos_core" }
serde_json = "1.0.150"
rdev = { version = "0.5.3", features = ["unstable_grab"] }
notify-rust = "4.18.0"
app_dirs2 = "2.5.5"
tower-http = { version = "0.7.0", features = ["fs"] }
turso = "0.8.0-pre.2"