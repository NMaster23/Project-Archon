[workspace]
resolver = "2"
members = [
    "crates/runner",
    "crates/core",
    "crates/audio",
    "crates/ai",
    "crates/executor",
    "crates/plugins",
    "crates/ui",
    "crates/transport"
]

[workspace.dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
log = "0.4.33"
anyhow = "1.0.103"
tokio-tungstenite = "0.26"
rmp-serde = "1.3"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
